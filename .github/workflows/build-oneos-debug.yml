# Builds a debug OneOS APK (the "full" edition, every phone) in a fork, for testing changes
# such as OxygenOS 16 on the Android 16 phones. A debug build is signed with the runner's debug
# key, not the OneOS release key: uninstall the official OneOS before installing it, and
# install the official one again (after uninstalling this) to get updates.
name: Build OneOS (debug)

on:
  workflow_dispatch:
  push:
    branches: [android16-oxygenos]

permissions:
  # contents: write publishes the APK to Releases, as Bon0618/sysmon does.
  contents: write
  # The SESL libraries come from GitHub Packages (settings.gradle.kts): the job token reads them.
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_PACKAGES_USER: ${{ github.actor }}
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: app-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The runner's own Android SDK (android-actions/setup-android@v3 asks for the retired "tools" package and fails).
      - name: Android 17 SDK platform (compileSdk 37)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --list 2>/dev/null | grep -E "platforms;android-3[67]" || true
          "$SDKM" --install "platforms;android-37.0" "platform-tools"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests of the phone table (core:model)
        continue-on-error: true
        run: ./gradlew --no-daemon :core:model:test

      - name: Guest manager APK (switcher/assets/guest_manager.apk)
        run: |
          ./gradlew --no-daemon :guest:assembleDebug
          cp guest/build/outputs/apk/debug/guest-debug.apk ../switcher/assets/guest_manager.apk

      - name: OneOS debug APK
        run: ./gradlew --no-daemon :app:assembleFullDebug

      # A direct download, no zip and no sign-in: one release per version, the newest marked latest, the APK
      # always under the same name so .../releases/latest/download/OneOS-android16.apk stays the same link.
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          TAG="android16-v${VER}"
          cp app/build/outputs/apk/full/debug/app-full-debug.apk OneOS-android16.apk
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" OneOS-android16.apk \
            --title "OneOS ${VER} + Android 16 (debug, build #${{ github.run_number }})" \
            --notes "OxygenOS 16 on every bar and flip Galaxy still on One UI 8.0/8.5 (branch ${{ github.ref_name }}, ${{ github.sha }}). Debug key: uninstall the official OneOS first." \
            --target "${{ github.sha }}" --latest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-model-test-report
          path: app-android/core/model/build/reports/tests/test
          if-no-files-found: ignore
